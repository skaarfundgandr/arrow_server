name: Trigger auto deployment for arrow-server

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/arrow-server-AutoDeployTrigger-92e759a2-a4fb-4709-ac33-bc93b29376f8.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARROWSERVER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ARROWSERVER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ARROWSERVER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: schoolregistry.azurecr.io
          registryUsername: ${{ secrets.ARROWSERVER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ARROWSERVER_REGISTRY_PASSWORD }}
          containerAppName: arrow-server
          resourceGroup: DefaultResourceGroup-CCAN
          imageToBuild: schoolregistry.azurecr.io/arrow-server:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


