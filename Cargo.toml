[package]
name = "arrow_server"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"

[lib]
name = "arrow_server_lib"
crate-type = ["rlib"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"


[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
azure_core = "1.1.0"
azure_identity = "1.0.0"
azure_storage_blob = "1.0.0"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
percent-encoding = "2.3.2"
chrono = "0.4.45"
bigdecimal = { version = "0.4.10", features = ["serde"] }
diesel = { version = "2.3.12", features = ["chrono", "mysql", "numeric"] }
diesel-async = { version = "0.9.2", features = ["mysql", "deadpool"] }
dotenvy = "0.15.7"
# azure_storage_blob 1.0.0 requires UnboundedReceiver::recv, which only futures 0.3.33 provides
futures = "=0.3.33"
once_cell = "1.21.4"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tower_governor = { version = "0.8", features = ["axum"] }
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
serde_with = "3.22.0"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.4"
serde_json = "1.0.151"
serial_test = "4.0.1"
tower = "0.5.3"
