[package]
name = "arrow_server"
version = "0.1.0"
edition = "2024"

[lib]
name = "arrow_server_lib"
crate-type = ["rlib"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"


[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.89"
axum = { version = "0.8.7", features = ["multipart"] }
azure_core = "1"
azure_identity = "1"
azure_storage_blob = "1"
base64 = "0.22"
percent-encoding = "2.3"
chrono = "0.4.42"
bigdecimal = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3.3", features = ["chrono", "mysql", "numeric"] }
diesel-async = { version = "0.7.4", features = ["mysql", "deadpool"] }
dotenvy = "0.15.7"
futures = "=0.3.33"
once_cell = "1.21.3"
serial_test = "3.2.0"
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
tower-http = { version = "0.6.7", features = ["cors"] }
tower_governor = { version = "0.8", features = ["axum"] }
tracing = { version = "0.1.43", features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
axum-extra = { version = "0.12.2", features = ["typed-header"] }
serde_with = "3.16.1"
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
serde_json = "1.0.145"
tower = "0.5.2"
