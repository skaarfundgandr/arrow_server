openapi: 3.0.0
info:
  title: Arrow Server API
  description: REST API for restaurant QR ordering and order management.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000/api/v1
    description: Local Development Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- DTOs ---
    LoginDTO:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    NewUserDTO:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    UpdateUserDTO:
      type: object
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        message:
          type: string

    UserDTO:
      type: object
      properties:
        user_id:
          type: integer
          nullable: true
          description: Only included for admins
        username:
          type: string
        role:
          $ref: '#/components/schemas/RoleDTO'
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string

    RoleDTO:
      type: object
      properties:
        role_id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string
            enum: [READ, WRITE, DELETE, ADMIN]

    NewRoleDTO:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    UpdateRoleDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    AssignRoleDTO:
      type: object
      required:
        - username
        - role_name
      properties:
        username:
          type: string
        role_name:
          type: string

    AddPermissionRequest:
      type: object
      required:
        - role_name
        - permission
      properties:
        role_name:
          type: string
        permission:
          type: string
          enum: [READ, WRITE, DELETE, ADMIN]

    SetPermissionDTO:
      type: object
      required:
        - permission
      properties:
        permission:
          type: string
          enum: [READ, WRITE, DELETE, ADMIN]

    CreateProductRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: string
          description: Decimal string
        product_image_uri:
          type: string
          description: URL of an externally hosted image (no upload endpoint)
        categories:
          type: array
          items:
            type: string

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: string
        product_image_uri:
          type: string
        categories:
          type: array
          items:
            type: string

    ProductResponse:
      type: object
      properties:
        product_id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: string
          description: Decimal string
        product_image_uri:
          type: string
          nullable: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'
          nullable: true

    CreateCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    CategoryResponse:
      type: object
      properties:
        category_id:
          type: integer
          nullable: true
          description: Hidden (null) on public category listing
        name:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true

    AssignCategoryRequest:
      type: object
      required:
        - category
        - product
      properties:
        category:
          type: string
        product:
          type: string

    OrderItemRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
        quantity:
          type: integer

    CreateOrderRequest:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [Pending, Accepted, Ready, Completed, Cancelled]
          description: Case-insensitive

    OrderItemResponse:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/ProductResponse'
        quantity:
          type: integer
        unit_price:
          type: string
          description: Price per unit at order time
        line_total:
          type: string
          description: quantity * unit_price

    OrderResponse:
      type: object
      properties:
        order_id:
          type: integer
        user_id:
          type: integer
          nullable: true
          description: null for guest orders
        products:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        total_amount:
          type: string
        status:
          type: string
          enum: [Pending, Accepted, Ready, Completed, Cancelled]
        payment_status:
          type: string
          enum: [unpaid, paid, failed]
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true

    CreateOrderResponse:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/OrderResponse'
        order_url:
          type: string
          description: Signed receipt link {API_BASE}/api/v1/orders/{id}?exp=&sig=

    PayOrderResponse:
      type: object
      properties:
        order_id:
          type: integer
        payment_status:
          type: string
          enum: [paid, failed]
        message:
          type: string

security:
  - BearerAuth: []

paths:
  # --- Auth ---
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
        '404':
          description: User not found

  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user (always CUSTOMER role)
      description: >-
        The username equal to ADMIN_USERNAME is reserved (409). The new user
        is auto-assigned the CUSTOMER role and receives a token on success.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUserDTO'
      responses:
        '201':
          description: User created and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: Username is reserved

  /auth/refresh:
    get:
      tags: [Auth]
      summary: Refresh token
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '404':
          description: User not found

  # --- Users ---
  /users:
    get:
      tags: [Users]
      summary: Get all users
      description: user_id is only included for admins.
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDTO'

  /users/create:
    post:
      tags: [Users]
      summary: Create user (Admin)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUserDTO'
      responses:
        '201':
          description: User created
        '403':
          description: Admin permission required

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: User not found
    post:
      tags: [Users]
      summary: Edit User (Admin)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDTO'
      responses:
        '200':
          description: User updated
        '403':
          description: Admin permission required
        '404':
          description: User not found
    delete:
      tags: [Users]
      summary: Delete User (Admin)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: User deleted
        '403':
          description: Admin permission required
        '404':
          description: User not found

  /users/search:
    get:
      tags: [Users]
      summary: Search user by username
      parameters:
        - in: query
          name: username
          schema:
            type: string
          required: true
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          description: Username query parameter is required
        '404':
          description: User not found

  # --- Roles (all Admin only) ---
  /roles:
    get:
      tags: [Roles]
      summary: Get all roles (Admin)
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDTO'
        '403':
          description: Admin permission required

  /roles/create:
    post:
      tags: [Roles]
      summary: Create Role (Admin)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRoleDTO'
      responses:
        '201':
          description: Role created
        '403':
          description: Admin permission required

  /roles/update/{id}:
    post:
      tags: [Roles]
      summary: Update Role (Admin)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleDTO'
      responses:
        '200':
          description: Role updated
        '403':
          description: Admin permission required
        '404':
          description: Role not found

  /roles/{id}:
    delete:
      tags: [Roles]
      summary: Delete Role (Admin)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Role deleted
        '403':
          description: Admin permission required
        '404':
          description: Role not found

  /roles/assign:
    post:
      tags: [Roles]
      summary: Assign role to user (Admin)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleDTO'
      responses:
        '201':
          description: Role assigned
        '403':
          description: Admin permission required
        '404':
          description: User or role not found

  /roles/add_permission:
    post:
      tags: [Roles]
      summary: Add permission to role (Admin)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPermissionRequest'
      responses:
        '200':
          description: Permission added
        '400':
          description: Invalid permission
        '403':
          description: Admin permission required

  /roles/{id}/set_permission:
    post:
      tags: [Roles]
      summary: Set permission (overwrite) by role ID (Admin)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPermissionDTO'
      responses:
        '200':
          description: Permission set
        '400':
          description: Invalid permission
        '403':
          description: Admin permission required
        '404':
          description: Role not found

  /roles/set_permission/{role_name}:
    post:
      tags: [Roles]
      summary: Set permission (overwrite) by role name (Admin)
      parameters:
        - in: path
          name: role_name
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPermissionDTO'
      responses:
        '200':
          description: Permission set
        '400':
          description: Invalid permission
        '403':
          description: Admin permission required
        '404':
          description: Role not found

  /roles/{id}/delete_permission:
    patch:
      tags: [Roles]
      summary: Reset permission to READ (Admin)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Permissions reset to READ
        '403':
          description: Admin permission required
        '404':
          description: Role not found

  # --- Products ---
  /products:
    get:
      tags: [Products]
      summary: Get all products (public)
      security: []
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
    post:
      tags: [Products]
      summary: Create product (WRITE permission or Admin)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
        '403':
          description: Permission denied
        '409':
          description: Product already exists

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product by ID (public)
      security: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found
    put:
      tags: [Products]
      summary: Update product (WRITE permission or Admin)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated
        '403':
          description: Permission denied
        '404':
          description: Product not found
    delete:
      tags: [Products]
      summary: Delete product (DELETE permission or Admin)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Product deleted
        '403':
          description: Permission denied
        '404':
          description: Product not found

  # --- Categories ---
  /categories:
    get:
      tags: [Categories]
      summary: Get all categories (public)
      description: category_id and timestamps are null on public responses.
      security: []
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      tags: [Categories]
      summary: Create category (WRITE permission or Admin)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category added successfully
        '403':
          description: Permission denied

  /categories/{id}:
    put:
      tags: [Categories]
      summary: Update category (WRITE permission or Admin)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '201':
          description: Category edited successfully
        '403':
          description: Permission denied
    delete:
      tags: [Categories]
      summary: Delete category (WRITE permission or Admin)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Category deleted successfully
        '403':
          description: Permission denied

  /categories/product:
    post:
      tags: [Categories]
      summary: Add product to category (WRITE permission or Admin)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCategoryRequest'
      responses:
        '201':
          description: Product assigned to category successfully
        '403':
          description: Permission denied
        '404':
          description: Product or category not found

  /categories/product/remove:
    post:
      tags: [Categories]
      summary: Remove product from category (WRITE permission or Admin)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCategoryRequest'
      responses:
        '200':
          description: Product removed from category successfully
        '403':
          description: Permission denied
        '404':
          description: Product or category not found

  /categories/{category_name}/products:
    get:
      tags: [Categories]
      summary: Get products by category (public)
      security: []
      parameters:
        - in: path
          name: category_name
          schema:
            type: string
          required: true
      responses:
        '200':
          description: List of products in category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Category not found

  # --- Orders ---
  /orders:
    get:
      tags: [Orders]
      summary: Get all orders (Admin)
      description: >-
        Optional ?status= filter (Pending, Accepted, Ready, Completed,
        Cancelled); unknown values return an empty list.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [Pending, Accepted, Ready, Completed, Cancelled]
          required: false
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '403':
          description: Admin permission required
    post:
      tags: [Orders]
      summary: Create order (public, optional JWT)
      description: >-
        No JWT creates a guest order (user_id null). A valid JWT attributes
        the order to the user; an invalid JWT is rejected with 401. Returns
        the order plus a signed order_url receipt link.
      security:
        - {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          description: Failed to create order (check products)
        '401':
          description: Invalid JWT provided

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order by ID
      description: >-
        Access: Admin, the JWT owner of the order, or anyone holding a valid
        signed order_url (exp + sig query params, no JWT required).
      security:
        - {}
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
        - in: query
          name: exp
          schema:
            type: integer
          required: false
          description: Expiry unix timestamp from the signed order_url
        - in: query
          name: sig
          schema:
            type: string
          required: false
          description: Hex HMAC-SHA256 signature over "order_id={id}&exp={exp}"
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid (tampered) order url
        '403':
          description: Permission denied (no valid token or order_url)
        '404':
          description: Order not found
        '410':
          description: Order url expired
    post:
      tags: [Orders]
      summary: Update order status (Admin / kitchen)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Order status updated
        '400':
          description: Missing or invalid status value
        '403':
          description: Admin permission required
        '404':
          description: Order not found
    delete:
      tags: [Orders]
      summary: Delete order (Admin)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Order deleted
        '403':
          description: Admin permission required
        '404':
          description: Order not found

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order (JWT owner or Admin)
      description: Guest orders (user_id null) can only be cancelled by an Admin.
      security:
        - {}
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Order cancelled
        '403':
          description: Permission denied
        '404':
          description: Order not found

  /orders/{id}/pay:
    post:
      tags: [Orders]
      summary: Pay order - mock payment (Admin or valid order_url)
      description: >-
        Deterministic mock: succeeds unless total_amount exceeds
        MAX_PAYMENT_AMOUNT (default 1000.00), which reports
        payment_status "failed" with HTTP 200. Already-paid orders return 409.
        The JWT owner's token alone does not grant payment.
      security:
        - {}
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
        - in: query
          name: exp
          schema:
            type: integer
          required: false
          description: Expiry unix timestamp from the signed order_url
        - in: query
          name: sig
          schema:
            type: string
          required: false
          description: Hex HMAC-SHA256 signature over "order_id={id}&exp={exp}"
      responses:
        '200':
          description: Payment processed (paid or failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayOrderResponse'
        '400':
          description: Invalid (tampered) order url
        '403':
          description: Permission denied (no valid token or order_url)
        '404':
          description: Order not found
        '409':
          description: Order already paid
        '410':
          description: Order url expired

  /orders/user/{username}:
    get:
      tags: [Orders]
      summary: Get orders by username (self or Admin)
      parameters:
        - in: path
          name: username
          schema:
            type: string
          required: true
      responses:
        '200':
          description: List of orders for user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '403':
          description: Permission denied
        '404':
          description: User not found

  /orders/role/{role_name}:
    get:
      tags: [Orders]
      summary: Get orders by role (Admin)
      parameters:
        - in: path
          name: role_name
          schema:
            type: string
          required: true
      responses:
        '200':
          description: List of orders by role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '403':
          description: Admin permission required

  # --- QR ---
  /qr/ordering:
    get:
      tags: [QR]
      summary: Get ordering QR code (Admin)
      description: >-
        SVG QR code (image/svg+xml) encoding {API_BASE_URL}/api/v1/qr/visit.
      responses:
        '200':
          description: QR code as SVG
          content:
            image/svg+xml:
              schema:
                type: string
        '403':
          description: Admin permission required

  /qr/visit:
    get:
      tags: [QR]
      summary: Visit redirect (public)
      description: 302 Found redirect to ORDERING_BASE_URL (the ordering frontend).
      security: []
      responses:
        '302':
          description: Redirect to the ordering page
